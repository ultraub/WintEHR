# Minimal CI: both test suites run on every PR. BOTH gates are hard zeros —
# 0 failed / 0 errors, with pass-count and outcome floors so tests cannot
# silently stop running (see the backend job's comment for the incident that
# motivated the floors). Never loosen either gate without a PR that explains
# why; if tests are legitimately removed, lower the floors in that same PR.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: these jobs only check out and run tests — they never write
# to the repo, so the GITHUB_TOKEN needs read access and nothing else.
# (CodeQL actions/missing-workflow-permissions.)
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: "pytest (baseline: 0 failed / 0 errors / 440 passed / 445 outcomes)"
        run: |
          python -m pytest tests/ -q --tb=no > pytest.out 2>&1 || true
          tail -3 pytest.out
          FAILED=$(grep -oE '[0-9]+ failed' pytest.out | grep -oE '[0-9]+' | head -1)
          ERRORS=$(grep -oE '[0-9]+ error' pytest.out | grep -oE '[0-9]+' | head -1)
          PASSED=$(grep -oE '[0-9]+ passed' pytest.out | grep -oE '[0-9]+' | head -1)
          SKIPPED=$(grep -oE '[0-9]+ skipped' pytest.out | grep -oE '[0-9]+' | head -1)
          FAILED=${FAILED:-0}; ERRORS=${ERRORS:-0}; PASSED=${PASSED:-0}; SKIPPED=${SKIPPED:-0}
          OUTCOMES=$((FAILED + PASSED + SKIPPED))
          echo "passed=$PASSED failed=$FAILED errors=$ERRORS skipped=$SKIPPED outcomes=$OUTCOMES"
          echo "baseline: failed<=0, errors<=0, passed>=440, outcomes>=445"
          # OUTCOMES is the load-bearing check. A test that stops RUNNING
          # reports nothing — not a failure, not an error, not a skip — so a
          # failure-count gate reads the loss as an improvement.
          #
          # PR #256 (pytest 7 -> 9) did exactly that: pytest-asyncio 0.21.1
          # pins pytest<8, and under pytest 9 it silently no-op'd 29 async
          # CDS-Hooks tests. Failures "improved" 44 -> 22 and the old gate
          # (failed<=44, errors<=29, passed>=360) passed it while coverage
          # shrank. Counting outcomes catches that; counting failures cannot.
          #
          # The error budget is now ZERO. All 29 previous errors were async
          # fixture teardown failing on a missing greenlet; declaring the
          # sqlalchemy[asyncio] extra fixed them. Keep it at zero.
          #
          # Never lower these to make a build green. If tests are legitimately
          # removed, lower them in that same PR and say why.
          if [ "$FAILED" -gt 0 ] || [ "$ERRORS" -gt 0 ] || [ "$PASSED" -lt 440 ] || [ "$OUTCOMES" -lt 445 ]; then
            echo "::error::Test results regressed past the baseline (failed<=0, errors<=0, passed>=440, outcomes>=445)"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: "eslint (errors are a hard zero; warnings report-only)"
        # ESLint 9 flat config (eslint.config.mjs). Error-level findings are
        # real bugs by construction (undefined JSX components, no-undef,
        # duplicate keys) — the backlog was fixed when the gate went hard, so
        # any new error fails the build. The ~1950 warnings are legacy
        # (mostly no-unused-vars); ratchet them separately.
        run: |
          npx eslint src -f compact > eslint.out 2>&1 || true
          tail -1 eslint.out
          ERRORS=$(grep -cE ", Error - " eslint.out || true)
          echo "eslint errors=$ERRORS (hard gate: 0)"
          if [ "$ERRORS" -gt 0 ]; then
            grep -E ", Error - " eslint.out | head -20
            echo "::error::New eslint error-level findings (gate is zero)"
            exit 1
          fi
      - name: "vitest (baseline: 0 failed / 517 total)"
        run: |
          # The suite is fully green: 517 tests, 0 failed. The failed budget
          # is a hard zero; the total/passed floors keep coverage from
          # silently shrinking (a test that stops RUNNING reports nothing —
          # see the backend job's comment). If tests are legitimately
          # removed, lower the floors in that same PR and say why.
          #
          # numTotalTests is the counterpart to the backend's OUTCOMES check:
          # it catches tests that stop running, which a failure-count gate
          # reads as an improvement. See the backend job for the concrete case
          # (PR #256). Ratchet DOWN as suites get fixed; never up without a PR
          # that explains why.
          npx vitest run --reporter=json --outputFile=vitest.json > vitest.out 2>&1 || true
          node -e "
            const r = require('./vitest.json');
            console.log(r.numTotalTests + ' tests, ' + r.numFailedTests + ' failed, ' + r.numPassedTests + ' passed (baseline: failed<=0, total>=517, passed>=517)');
            if (r.numFailedTests > 0 || r.numTotalTests < 517 || r.numPassedTests < 517) {
              console.error('::error::Test results regressed past the baseline (failed<=0, total>=517, passed>=517)');
              process.exit(1);
            }"
